name: erp-ammir

services:
  erp:
    image: ${IMAGE_REPO:?IMAGE_REPO is not set in .env}:${IMAGE_TAG:?IMAGE_TAG is not set in .env}
    restart: unless-stopped
    env_file: erp.env
    environment:
      APP_VERSION: ${IMAGE_TAG}
    ports:
      - "127.0.0.1:4568:4568"
    volumes:
      - erp-data:/data
    stop_grace_period: 20s
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  erp-data:
