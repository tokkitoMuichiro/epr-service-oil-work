name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  image:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/erp-ammir" >> "$GITHUB_OUTPUT"
          echo "tag=v${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        env:
          IMAGE: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker run -d --name smoke -p 4568:4568 -e PUBLIC_URL=http://localhost:4568 "$IMAGE"
          for i in $(seq 1 30); do
            curl -fsS http://localhost:4568/health > health.json && break
            sleep 1
          done
          cat health.json
          grep -q "\"version\":\"$TAG\"" health.json
          curl -fsS http://localhost:4568/contracts | grep -q '<div id="app"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4568/api/personnel)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"role":"admin"}' http://localhost:4568/api/auth/dev-login)" = 404
          docker stop -t 20 smoke
          test "$(docker inspect -f '{{.State.ExitCode}}' smoke)" = 0

      - name: Push image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker tag "$IMAGE:$TAG" "$IMAGE:sha-${GITHUB_SHA::7}"
          docker tag "$IMAGE:$TAG" "$IMAGE:latest"
          docker push --all-tags "$IMAGE"

      - name: Tag release
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

  deploy:
    needs: image
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.image.outputs.tag }}
    secrets: inherit
